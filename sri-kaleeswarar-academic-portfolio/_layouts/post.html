---
layout: default
---
<article class="page-shell article-shell"><a class="back-link" href="{{ '/journal/' | relative_url }}">← All updates</a><p class="eyebrow">{{ page.category | default: 'Update' }} · {{ page.date | date: '%B %-d, %Y' }}</p><h1>{{ page.title }}</h1>{% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}<div class="article-content">{{ content }}</div>{% if page.tags %}<div class="tag-list">{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</div>{% endif %}</article>
